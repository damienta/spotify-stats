[project]
name = "stats-jobs"
version = "0.1.0"
description = "Batch jobs: DuckDB stats now, Spark later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project.scripts]
local-stats = "stats_jobs.cli:main"
convert-listens = "stats_jobs.cli:convert"
