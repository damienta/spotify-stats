[project]
name = "stats-api"
version = "0.1.0"
description = "FastAPI app served from Lambda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "stats-ingest",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
stats-ingest = { workspace = true }
