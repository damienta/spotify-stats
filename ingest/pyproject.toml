[project]
name = "stats-ingest"
version = "0.1.0"
description = "Spotify OAuth, the recently-played poller and the GDPR export import"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project.scripts]
parse-export = "stats_ingest.cli:main"
spotify-login = "stats_ingest.spotify_cli:login"
fetch-recent = "stats_ingest.spotify_cli:fetch_recent"
